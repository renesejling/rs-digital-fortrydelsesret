name: Build & Release

# Kører automatisk når du pusher et version-tag (fx v1.2.0)
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Opsæt PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer


      - name: Installer produktions-afhængigheder (Dompdf m.m.)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Byg plugin-zip (inkl. vendor/)
        run: |
          PLUGIN_SLUG="rs-digital-fortrydelsesret"
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build/"$PLUGIN_SLUG"

          # Kopiér alt der skal med i pluginnet til en mappe med korrekt slug-navn.
          # .distignore er committet i repoet og derfor altid tilgængelig.
          # Ingen fallback: fejler dette, skal builden fejle højt frem for at
          # producere en zip med interne filer (README.md, CLAUDE.md, docs/ ...).
          rsync -a --exclude-from='.distignore' ./ build/"$PLUGIN_SLUG"/

          cd build
          zip -r "../${PLUGIN_SLUG}.zip" "$PLUGIN_SLUG"
          cd ..
          echo "Bygget ${PLUGIN_SLUG}.zip (version ${VERSION})"

      - name: Verificér zip-indhold (ingen interne filer)
        run: |
          PLUGIN_SLUG="rs-digital-fortrydelsesret"
          DIR="build/${PLUGIN_SLUG}"
          FAIL=0

          # Disse må IKKE være med i det kunden installerer.
          for ENTRY in \
            "CLAUDE.md" \
            "README.md" \
            "CHANGELOG.md" \
            "docs" \
            "composer.json" \
            "composer.lock" \
            ".gitignore" \
            ".distignore" \
            ".github" \
            ".git"
          do
            if [ -e "${DIR}/${ENTRY}" ]; then
              echo "::error::'${ENTRY}' må ikke være med i plugin-zip'en (tjek .distignore)"
              FAIL=1
            fi
          done

          if find "$DIR" \
               \( -name '.DS_Store' -o -name '*.code-workspace' -o -name '*.log' \) \
               -print -quit | grep -q .; then
            echo "::error::Fandt .DS_Store / *.code-workspace / *.log i plugin-zip'en"
            FAIL=1
          fi

          # Sanity check: disse SKAL være med.
          for ENTRY in \
            "${PLUGIN_SLUG}.php" \
            "uninstall.php" \
            "includes" \
            "assets" \
            "languages" \
            "vendor/autoload.php"
          do
            if [ ! -e "${DIR}/${ENTRY}" ]; then
              echo "::error::'${ENTRY}' mangler i plugin-zip'en"
              FAIL=1
            fi
          done

          [ "$FAIL" -eq 0 ] || exit 1

          echo "OK — zip-indholdet ser rigtigt ud:"
          ls -a "$DIR"

      - name: Opret GitHub Release med zip vedhæftet
        uses: softprops/action-gh-release@v2
        with:
          files: rs-digital-fortrydelsesret.zip
          generate_release_notes: true
